<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clockify &mdash; Time Entry Dashboard</title>
<style>

/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  background:#f2f6f8;
  color:#333333;
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar{
  background:#ffffff;
  border-bottom:1px solid #e8edf0;
  height:56px;
  display:flex;
  align-items:center;
  padding:0 28px;
  gap:12px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:15px;
  font-weight:700;
  color:#03a9f4;
  letter-spacing:-.2px;
  text-decoration:none;
}
.logo:hover{color:#0288d1}
.logo svg{flex-shrink:0}
.topbar-date{
  margin-left:auto;
  font-size:12px;
  color:#999999;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.main{
  max-width:980px;
  margin:0 auto;
  padding:24px 20px 48px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.weekend-msg{text-align:center;padding:60px 20px}

}</style></head></html>
