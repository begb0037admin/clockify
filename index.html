<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;

    min-height: 100vh;

      <span class="badge badge-info"><span class="spinner"></span>Loading KB&#x2026;</span>
    </div>

<script>
// â”€â”€â”€ CONFIG â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const BASE = 'https://raw.githubusercontent.com/begb0037admin/clockify/main';
const URLS = {
  claude:   BASE + '/CLAUDE.md',
  status:   BASE + '/docs/STATUS.md',
  handover: BASE + '/docs/HANDOVER.md',
  kb:       BASE + '/docs/reference/CLOCKIFY_KB.md',
};
const DAY_TOTAL = 7 * 60 + 15; // 435 mins

// â”€â”€â”€ STATE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let today      = new Date();
let kbEvents   = [];   // parsed from KB Calendar Event Mapping table
let adHoc      = [];   // { _id, label, project, task, mins }
let handover   = '';
let loadedOk   = false;
let loadErrors = [];
let adhocId    = 0;

// â”€â”€â”€ DATE UTILS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtDate(d) {
  return d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function minsToHH(m) {
  if (m < 0) m = 0;
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}
function isWeekend(d) { return d.getDay()===0 || d.getDay()===6; }

// â”€â”€â”€ KB PARSER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function parseTable(text, headerPattern) {
  // Find section by header regex, then grab the markdown table that follows
  const lines = text.split('\n');
  let inSection = false, inTable = false, headers = [], rows = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (headerPattern.test(l)) { inSection = true; continue; }
    if (inSection && /^##/.test(l) && !headerPattern.test(l)) break; // next section
    if (!inSection) continue;
    if (/^\|/.test(l)) {
      const cells = l.split('|').map(c => c.trim()).filter((_,i,a) => i>0 && i<a.length-1);
      if (!headers.length) { headers = cells; continue; }
      if (/^[-| ]+$/.test(l)) continue; // separator row
      const obj = {};
      headers.forEach((h,i) => obj[h] = cells[i] || '');
      rows.push(obj);
    }
  }
  return rows;
}

function parseDurMins(s) {
  // "0:15", "1:00", "0:30 or 1:00" -- take first match
  const m = s.match(/(\d+):(\d+)/);
  return m ? parseInt(m[1])*60 + parseInt(m[2]) : null;
}

function notesToDow(notes) {
  const n = notes.toLowerCase();
  if (/every weekday|mon.{0,5}fri|daily/.test(n)) return [1,2,3,4,5];
  if (/monday/.test(n))    return [1];
  if (/tuesday/.test(n))   return [2];
  if (/wednesday/.test(n)) return [3];
  if (/thursday/.test(n))  return [4];
  if (/friday/.test(n))    return [5];
  return null; // not auto-recurring
}

function parseKB(text) {
  const rows = parseTable(text, /## Calendar Event to Project\/Task Mapping/);
  return rows
    .filter(r => r['Calendar event'] && r['Project'] && r['Project'] !== 'â€”')
    .map(r => ({
      label:    r['Calendar event'],
      project:  r['Project'],
      task:     r['Task'] === 'â€”' ? '' : r['Task'],
      mins:     parseDurMins(r['Duration']),
      notes:    r['Notes'] || '',
      dow:      notesToDow(r['Notes'] || ''),
      variable: /or|as per/i.test(r['Duration']),
    }));
}

function extractHandover(text) {
  if (!text) return 'Could not load.';
  const lines = text.split('\n');
  let out = [], capture = false;
  for (const l of lines) {
    if (/^## (TL;DR|State of Play|Next Concrete Action)/i.test(l)) capture = true;
    else if (/^## Watch Out For/i.test(l)) capture = false;
    if (capture) out.push(l);
  }
  return out.join('\n').trim() || text.slice(0,600);
}

// â”€â”€â”€ FETCH â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function fetchFile(url) {
  const r = await fetch(url, { cache:'no-cache' });
  if (!r.ok) throw new Error(r.status);
  return r.text();
}

async function bootstrap() {
  loadErrors = [];
  try {
    const [, , handoverRaw, kbRaw] = await Promise.all([
      fetchFile(URLS.claude).catch(()=>{ loadErrors.push('CLAUDE.md'); return ''; }),
      fetchFile(URLS.status).catch(()=>{ loadErrors.push('STATUS.md'); return ''; }),
      fetchFile(URLS.handover).catch(()=>{ loadErrors.push('HANDOVER.md'); return ''; }),
      fetchFile(URLS.kb).catch(()=>{ loadErrors.push('CLOCKIFY_KB.md'); return ''; }),
    ]);
    handover = extractHandover(handoverRaw);
    kbEvents = parseKB(kbRaw);
    loadedOk = loadErrors.length === 0;
  } catch(e) {
    loadedOk = false;
  }
  render();
}

// â”€â”€â”€ PLAN BUILDER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function buildPlan() {
  const dow = today.getDay();
  const rows = [];

  // Auto-apply recurring events from KB
  for (const ev of kbEvents) {
    if (ev.dow && ev.dow.includes(dow) && ev.mins !== null && !ev.variable) {
      rows.push({ label: ev.label, project: ev.project, task: ev.task, mins: ev.mins, type: 'recurring' });
    }
  }

  // Ad-hoc additions
  for (const a of adHoc) rows.push({ ...a, type: 'adhoc' });

  // Gap fill
  const meetingMins = rows.reduce((s,r) => s+r.mins, 0);
  rows.push({
    label: 'Gap fill', project: 'Focussed time: Email and Teams messages', task: 'BAU',
    mins: DAY_TOTAL - meetingMins, type: 'gapfill'
  });
  return rows;
}

// â”€â”€â”€ PROMPT BUILDER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function buildPrompt(rows) {
  const isMonday = today.getDay() === 1;
  const total = rows.reduce((s,r) => s+r.mins, 0);
  const planLines = rows.map(r => '| ' + r.project + ' | ' + (r.task || 'BAU') + ' | ' + minsToHH(r.mins) + ' |').join('\n');
  return 'We are logging the Clockify timesheet for ' + fmtDate(today) + '. The plan has been confirmed:\n\n| Project | Task | Duration |\n|---------|------|----------|\n' + planLines + '\n| **TOTAL** | | **' + minsToHH(total) + '** |\n\nPlease:\n1. Navigate to https://app.clockify.me/timesheet\n2. Confirm the correct week is showing' + (isMonday ? '\n3. Click Apply on the Weekly Standard template before adding any rows' : '') + '\n3. For each row above, find or add the row\n4. Task selection: click the arrow next to "N Tasks" to expand inline â€” do NOT click the task count badge\n5. Enter the duration in today\'s (' + DAYS[today.getDay()] + ') column\n6. Enter gap fill (Focussed time: BAU) last\n7. Confirm daily total shown in Clockify = ' + minsToHH(DAY_TOTAL) + '\n8. Report back when done\n\nHard rules: never log more or less than ' + minsToHH(DAY_TOTAL) + '. Never attempt API writes.\n\nAfter logging: update HANDOVER.md, STATUS.md, CLOCKIFY_KB.md and push to GitHub main.';
}

// â”€â”€â”€ AD HOC â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function addAdHoc() {
  const ep = document.getElementById('eventPick');
  const dp = document.getElementById('durPick');
  const mins = parseInt(dp.value);

  let label, project, task;
  if (ep && ep.value) {
    const opt = ep.options[ep.selectedIndex];
    label   = opt.value;
    project = opt.dataset.project || '';
    task    = opt.dataset.task    || '';
  } else {
    return;
  }

  const id = 'ah' + (adhocId++);
  adHoc.push({ _id: id, label, project, task, mins });
  render();
}

function removeAdHoc(id) {
  adHoc = adHoc.filter(a => a._id !== id);
  render();
}

function copyPrompt() {
  const text = buildPrompt(buildPlan());
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'âœ“ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = '&#x1f4cb; Copy prompt'; btn.classList.remove('copied'); }, 2500);
  });
}

// â”€â”€â”€ ESCAPE HELPERS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }

// â”€â”€â”€ END OF SESSION â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function buildEOSPrompt() {
  const rows = buildPlan().filter(r => r.type !== 'gapfill');
  const lines = rows.map(r => '- ' + r.label + ': ' + r.project + ' / ' + (r.task || 'BAU') + ' / ' + minsToHH(r.mins)).join('\n');
  return 'Clockify session complete for ' + fmtDate(today) + '.\n\nEntries logged today:\n' + lines + '\n- Gap fill: Focussed time: Email and Teams messages / BAU / ' + minsToHH(buildPlan().find(r=>r.type==='gapfill').mins) + '\n\nPlease:\n1. Update docs/HANDOVER.md with today\'s TL;DR, state of play, next action, and watch-outs\n2. Update docs/STATUS.md â€” move today to Completed, set tomorrow as Up Next\n3. Update docs/reference/CLOCKIFY_KB.md â€” add today to Logged Days Reference, add any new confirmed mappings\n4. Show me the updated files so I can review before pushing';
}

function copyEOS() {
  navigator.clipboard.writeText(buildEOSPrompt()).then(() => {
    const btn = document.getElementById('eosBtn');
    btn.textContent = 'âœ“ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = '&#x1f4cb; Copy end-of-session prompt'; btn.classList.remove('copied'); }, 2500);
  });
}

function copyGit() {
  const cmd = 'git add docs/HANDOVER.md docs/STATUS.md docs/reference/CLOCKIFY_KB.md\ngit commit -m "Timesheet logged: ' + fmtDate(today) + '"\ngit push origin main';
  navigator.clipboard.writeText(cmd).then(() => {
    const btn = document.getElementById('gitBtn');

    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = '&#x1f4cb; Copy git command'; btn.classList.remove('copied'); }, 2500);
  });
}
